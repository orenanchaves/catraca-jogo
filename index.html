<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catraca</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#07070c;overflow:hidden;
    font-family:"Courier New",monospace;color:#8a8fa3}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges}

  /* o jogo no meio, o resto nas beiradas */
  #palco{height:100%;display:flex;align-items:center;justify-content:center;gap:28px}
  /* sem painel (celular, janela estreita) o jogo toma a tela toda;
     com painel ele vira uma coluna com a proporção do canvas */
  #game{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  /* ---------- por que a coluna do jogo tem tamanho em pixel ----------
     Era `width:auto` com `aspect-ratio`. Num flex row isso faz a largura
     sair do CONTEÚDO — e o conteúdo é o canvas, que o Phaser dimensiona
     medindo justamente esta caixa. A conta é circular: o canvas cresce,
     a coluna cresce junto, os painéis encolhem pra caber, sobra mais
     espaço, o canvas cresce de novo. Medido a 1280×720: a coluna pedia
     894px pra um canvas de 400 e espremia os painéis de 236 pra 165.

     Agora quem manda é a JANELA. O `painel.js` mede uma vez por resize e
     escreve largura e altura em pixel aqui; o Phaser mede um número que
     não depende dele. `flex:0 0 auto` nos três para ninguém esticar nem
     encolher com o que tem dentro. */
  body.comPainel #game{flex:0 0 auto;min-width:0;overflow:hidden}

  /* painéis: escondidos por padrão, aparecem só quando há tela sobrando */
  .painel{display:none;width:236px;max-height:100%;overflow:auto;
    flex-direction:column;gap:14px;font-size:12px;letter-spacing:1px}
  body.comPainel .painel{display:flex;flex:0 0 236px}

  .marca{font-size:30px;letter-spacing:6px;color:#f2f0ff;font-weight:bold}
  .sub{font-size:10px;letter-spacing:3px;color:#5a5f74;margin-top:-4px}

  .bloco{background:#0e0e18;border:1px solid #1c1c2c;border-radius:2px;padding:12px 14px}
  .bloco h2{margin:0 0 10px;font-size:10px;letter-spacing:3px;color:#5a5f74;font-weight:normal}

  .linha{display:flex;justify-content:space-between;gap:10px;padding:3px 0;align-items:baseline}
  .rot{color:#5a5f74;font-size:10px;letter-spacing:2px;flex:0 0 auto}
  .val{color:#f2f0ff;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frase{margin-top:10px;color:#6a6f84;font-size:11px;line-height:1.5;letter-spacing:0}

  .dica .dicaTxt{color:#f2c14e;font-size:13px;line-height:1.4;letter-spacing:0;min-height:2.8em}

  /* o painel da direita responde três perguntas, nesta ordem: o que eu
     tenho que fazer, onde eu estou, que horas são. Cada uma tem uma
     linha grande e o resto em voz baixa — era tudo do mesmo tamanho, e
     por isso nada se lia primeiro. */
  .missao{border-left:3px solid #f2c14e}
  .mQuem{color:#f2c14e;font-size:10px;letter-spacing:2px;margin-bottom:4px}
  .mOrdem{color:#f2f0ff;font-size:14px;line-height:1.35;letter-spacing:0}
  .mPrazo{margin-top:6px;color:#6a6f84;font-size:11px;letter-spacing:1px}

  .ondeNome{color:#f2f0ff;font-size:15px;letter-spacing:1px;line-height:1.2}
  .ondeLinha{font-size:10px;letter-spacing:2px;margin-top:3px}
  .sep{height:1px;background:#1c1c2c;margin:10px 0 4px}

  .horaGr{color:#f2c14e;font-size:26px;letter-spacing:2px;line-height:1}
  .faixaNome{color:#8a8fa3;font-size:10px;letter-spacing:2px;margin-top:4px}

  .rodape{color:#4a4f62;font-size:10px;letter-spacing:2px;text-align:center;padding:2px 0 6px}

  .tecla{display:flex;align-items:baseline;gap:10px;padding:3px 0}
  .tecla b{color:#f2f0ff;flex:0 0 78px;font-size:11px;letter-spacing:1px}
  .tecla span{color:#6a6f84;font-size:11px;letter-spacing:0}
  .obs{margin-top:8px;color:#4a4f62;font-size:10px;letter-spacing:0}

  .bt{display:block;width:100%;margin-bottom:8px;padding:8px 10px;cursor:pointer;
    background:#14141f;border:1px solid #2a2a3c;border-radius:2px;color:#8a8fa3;
    font-family:inherit;font-size:11px;letter-spacing:2px;text-align:left}
  .bt:hover{border-color:#3d3d55;color:#f2f0ff}
  .bt.on{color:#00e676;border-color:#1e5c3c}
</style>

<div id="palco">
  <aside id="esq" class="painel"></aside>
  <div id="game"></div>
