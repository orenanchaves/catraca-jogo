# Publica o jogo no GitHub Pages a cada push na main.
name: Publica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # só o jogo vai pro ar: nem o README, nem o workflow
      - name: Separa o que vai pro ar
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/
          find _site -type f | sort

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
